name: Bug report
description: Report a reproducible parser, renderer, or showcase issue.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md. Do not include confidential source or credentials."
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal source and reproduction steps
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Revision, runtime/browser, operating system
    validations:
      required: true
