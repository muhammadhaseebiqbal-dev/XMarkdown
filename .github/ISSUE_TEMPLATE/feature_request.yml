name: Feature proposal
description: Propose a document capability or integration improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Document use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed syntax, boundary, and alternatives
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Compatibility and evaluation plan
